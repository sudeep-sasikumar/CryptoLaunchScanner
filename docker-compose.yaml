# Launch Radar on a VPS (README "Running on the VPS").
# Made for Hostinger Docker Manager -> "Compose from URL" with this file's raw GitHub link:
#   https://raw.githubusercontent.com/sudeep-sasikumar/CryptoLaunchScanner/main/docker-compose.yaml
# Hostinger downloads ONLY this file, so nothing here refers to other files. The image is built
# by GitHub Actions (.github/workflows/docker-image.yml) on every push; a redeploy pulls the latest.
#
# HTTPS: the VPS already runs Traefik (set up for Ignition & Coil). The dashboard is served under
# /radar/ on the same hostname, so it reuses that hostname's certificate: no new domain needed.
# (Traefik prefers the longer rule, so /radar/ goes here and everything else stays with Ignition & Coil.)
#
# Environment variables to enter in Docker Manager (only the first four matter to get going):
# Holder data (insiders, bundlers, snipers, dev, top 10) - add any of these; each one fills what the others miss:
#   CODEX_API_KEY             codex.io, free plan (one-time $1 activation): every chain incl. Robinhood
#   SOLANATRACKER_API_KEY     solanatracker.io, free plan: Solana tokens
#   COINGECKO_DEMO_API_KEY    coingecko.com/en/api, free: 6x more GeckoTerminal lookups (holders, discovery)
#   GMGN_API_KEY              gmgn.ai/ai: the most complete (phishing, KOLs, X followers ...); free tier needs a
#                             $100 balance kept in the GMGN account
#   TELEGRAM_BOT_TOKEN        from @BotFather (the Ignition & Coil bot works for alerts)
#   TELEGRAM_CHAT_ID          your chat id; several chats: comma-separated (a group id starts with -100)
#   DASHBOARD_PASSWORD        required for the dashboard - pick a long one
#   TELEGRAM_THREAD_ID        optional - post into one topic of a forum group
#   TELEGRAM_OUTCOME_UPDATES  optional - true/false: reply under each call when it hits 2x or stops out (default true)
#   TELEGRAM_SILENT_OUTCOMES  optional - true/false: those replies arrive without a sound (default true)
#   TELEGRAM_DAILY_SUMMARY_UTC optional - time of the daily summary, e.g. 06:00, or off
#   TELEGRAM_COMMANDS         optional - true to answer /status /calls /stats (needs a bot of its own, not Ignition & Coil's)
#   CALL_MIN_CHANCE           optional - only call coins with at least this % chance of 2x (default 50; lower = more calls)
#   CALLS_PER_HOUR            optional - most calls sent in one hour (default 10)
#   PULL_PROOF_ONLY           optional - true (default): only call coins whose liquidity cannot be pulled; false = all
#   CALL_MIN_TIER             optional - 1 (default) = only 🔥 high and 🔥🔥 very high calls; 2 = very high only; 0 = all
#   PAPER_TRADING             optional - true (default): $ paper trade on every very high conviction call (no real money)
#   PAPER_STAKE_USD           optional - paper stake per trade (default 25)
#   PAPER_MIN_TIER            optional - 2 (default) = very high only, 1 = high and very high
#   AUTO_RETRAIN              optional - false (default): the model in use stays until a retrain is asked for; true = every 12 h
#   GMGN_WEIGHT_PER_SEC       optional - 5 on GMGN's free plan, 20 on Plus, 50 on Pro
#   SOLANA_WS_URL             optional - a private Solana RPC websocket (e.g. free Helius key); steadier than the public one
#   ANTHROPIC_API_KEY         optional - lets Claude rate each candidate's meme / narrative
#   DOMAIN                    optional - defaults to this VPS's Hostinger hostname
services:
  radar:
    image: ghcr.io/sudeep-sasikumar/cryptolaunchscanner:latest
    pull_policy: always                   # a redeploy picks up the newest image
    restart: unless-stopped
    environment:
      GMGN_API_KEY: ${GMGN_API_KEY:-}
      CODEX_API_KEY: ${CODEX_API_KEY:-}
      SOLANATRACKER_API_KEY: ${SOLANATRACKER_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_THREAD_ID: ${TELEGRAM_THREAD_ID:-}
      TELEGRAM_OUTCOME_UPDATES: ${TELEGRAM_OUTCOME_UPDATES:-}
      TELEGRAM_SILENT_OUTCOMES: ${TELEGRAM_SILENT_OUTCOMES:-}
      TELEGRAM_DAILY_SUMMARY_UTC: ${TELEGRAM_DAILY_SUMMARY_UTC:-}
      TELEGRAM_COMMANDS: ${TELEGRAM_COMMANDS:-}
      CALLS_PER_HOUR: ${CALLS_PER_HOUR:-}
      CALL_MIN_CHANCE: ${CALL_MIN_CHANCE:-}
      PULL_PROOF_ONLY: ${PULL_PROOF_ONLY:-}
      CALL_MIN_TIER: ${CALL_MIN_TIER:-}
      PAPER_TRADING: ${PAPER_TRADING:-}
      PAPER_STAKE_USD: ${PAPER_STAKE_USD:-}
      PAPER_MIN_TIER: ${PAPER_MIN_TIER:-}
      AUTO_RETRAIN: ${AUTO_RETRAIN:-}
      GMGN_WEIGHT_PER_SEC: ${GMGN_WEIGHT_PER_SEC:-}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}   # required: without it the dashboard stays off
      SOLANA_WS_URL: ${SOLANA_WS_URL:-}
      COINGECKO_DEMO_API_KEY: ${COINGECKO_DEMO_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # login is enforced because bind_host is not localhost; cookies only over HTTPS
      RADAR_OVERRIDES: "dashboard.bind_host=0.0.0.0;dashboard.cookie_secure=true;dashboard.base_url=https://${DOMAIN:-srv1479428.hstgr.cloud}/radar/"
    volumes:
      - radar_data:/app/var               # database, learned models, logs (capped at 20 GB by the app)
    expose:
      - "8010"                            # reached only through Traefik
    labels:
      - traefik.enable=true
      - traefik.http.routers.launch-radar.rule=Host(`${DOMAIN:-srv1479428.hstgr.cloud}`) && PathPrefix(`/radar`)
      - traefik.http.routers.launch-radar.entrypoints=websecure
      - traefik.http.routers.launch-radar.tls=true
      - traefik.http.routers.launch-radar.tls.certresolver=letsencrypt
      - traefik.http.routers.launch-radar.middlewares=launch-radar-slash,launch-radar-strip
      # /radar -> /radar/ (the page loads its data with relative links), then strip /radar for the app
      - traefik.http.middlewares.launch-radar-slash.redirectregex.regex=^(https?://[^/]+/radar)$$
      - traefik.http.middlewares.launch-radar-slash.redirectregex.replacement=$${1}/
      - traefik.http.middlewares.launch-radar-slash.redirectregex.permanent=true
      - traefik.http.middlewares.launch-radar-strip.stripprefix.prefixes=/radar
      - traefik.http.services.launch-radar.loadbalancer.server.port=8010
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

volumes:
  radar_data:
