# Launch Radar - configuration. Signals only: this program never trades.
# Secrets (Telegram, dashboard password, optional API keys) live in .env, not here.
# Any value can be overridden without editing this file:  RADAR_OVERRIDES="call.top_pct=1.5;label.target=3"

app:
  data_dir: var              # database, models, logs
  log_level: INFO

# ---------------------------------------------------------------- where launches come from
sources:
  pump:                      # pump.fun: every create / trade / graduation, straight from the Solana program logs
    enabled: true
    ws_url: wss://api.mainnet-beta.solana.com    # free public RPC; SOLANA_WS_URL in .env overrides (e.g. a Helius key)
    rpc_url: https://api.mainnet-beta.solana.com
    stall_s: 30              # no message for this long = reconnect
  gecko:                     # new DEX pools via GeckoTerminal (free): launches GMGN's feed does not list, and the
    enabled: true            # only discovery source when no GMGN key is set
    calls_per_min: 5         # measured free limit (burst of 6, then ~1 per 12 s); 25 with COINGECKO_DEMO_API_KEY
    # poll_s is used on the free limit, fast_poll_s when the demo key is set
    networks:
      solana:    {poll_s: 30,  fast_poll_s: 10, skip_dexes: [pump-fun, pumpswap]}   # pump.fun is covered natively above
      robinhood: {poll_s: 60,  fast_poll_s: 20}                                      # PONS, StonkBrokers, Uniswap v4 ...
      bsc:       {poll_s: 180, fast_poll_s: 45, only_launchpads: true}               # four.meme ...
      base:      {poll_s: 180, fast_poll_s: 45, only_launchpads: true}               # Clanker, Zora, Virtuals ...
    # dex ids that are bonding curves (liquidity held by the launchpad's program until it graduates)
    curve_dexes: [launchlab, meteora-dbc, pons-v2, four-meme, fourmeme, moonshot, boop, heaven, stonk, sunpump]
  # never tracked: on 2026-10-14..16 every fluxbeam "launch" (60, named MASKED, DOPE, JitoSOL ...) was a
  # pool farm with liquidity = market cap and the same 6x pump at ~49 min - fake wins that drew 20 calls
  skip_launchpads: [fluxbeam]
  # one name per launchpad, whichever source reported it (GeckoTerminal dex id or GMGN platform name;
  # case-insensitive substring match, first match wins). Shown in alerts and learned as a factor.
  launchpad_names:
    - [pons, pons]
    - [letsbonk, letsbonk]
    - [bonkers, letsbonk]
    - [launchlab, launchlab]          # Raydium LaunchLab, also used by StonkFun
    - [ray_launchpad, launchlab]
    - [meteora-dbc, meteora-dbc]      # Meteora dynamic bonding curve: Believe, Bags, Jupiter Studio ...
    - [meteora_virtual_curve, meteora-dbc]
    - [bags, bags]
    - [believe, believe]
    - [jup_studio, jupiter-studio]
    - [moonshot, moonshot]
    - [moonit, moonshot]
    - [boop, boop]
    - [heaven, heaven]
    - [stonk, stonks]
    - [four, four.meme]
    - [flap, flap]
    - [clanker, clanker]
    - [zora, zora]
    - [bankr, bankr]
    - [virtuals, virtuals]
    - [flaunch, flaunch]
    - [klik, klik]
    - [hoodit, hoodit]
    - [frontier-fun, frontier-fun]
    - [longxyz, longxyz]
    - [circus, circus]
    - [sunpump, sunpump]
    - [uniswap-pools-trade, pools-trade]
  dexscreener:
    calls_per_min: 200       # documented limit 300
    poll_s: 15               # price / volume snapshot cadence for tokens younger than 15 minutes ...
    old_poll_s: 30           # ... and for older ones
  gmgn:                      # GMGN OpenAPI (GMGN_API_KEY): holders, insiders, bundlers, phishing, snipers, dev,
    enabled: true            # smart money / KOLs, socials, contract safety - and new launches on every launchpad
    weight_per_sec: 5        # free plan 5, Plus 20, Pro 50 (token calls weigh 1, the launch feed 2)
    feed_limit: 30           # newest launches fetched per poll
    max_age_s: 600           # launches older than this when first seen are ignored
    # which launchpads to watch per chain (GMGN's names); pump.fun on Solana is read from the chain itself,
    # its feed entries only add socials (X followers, TG calls, reused links)
    chains:
      sol:       {poll_s: 8,  platforms: [letsbonk, bonkers, bags, believe, moonshot_app, Moonshot, boop, ray_launchpad,
                                          meteora_virtual_curve, heaven, jup_studio, xstocks, liquid, surge, anoncoin,
                                          wendotdev, sugar, token_mill, trendsfun, trends_fun, memoo, bankr, zora]}
      sol_pump:  {poll_s: 10, chain: sol, socials_only: true, platforms: [Pump.fun, pump_mayhem, pump_agent, pump_mayhem_agent]}
      robinhood: {poll_s: 10, platforms: [pons_v2, pons, flap, bankr, clanker, longxyz, circus]}
      bsc:       {poll_s: 10, platforms: [fourmeme, fourmeme_agent, bn_fourmeme, four_xmode_agent, flap, flap_stocks, clanker, lunafun]}
      base:      {poll_s: 15, platforms: [clanker, bankr, flaunch, zora, zora_creator, baseapp, basememe, virtuals_v2, klik]}
  rugcheck: {enabled: true, calls_per_min: 12}     # Solana holders / insiders / risk flags (limit 15)
  # GMGN-like holder data from other services - each optional, each with its own key (see README):
  codex:                     # CODEX_API_KEY - every chain: holders, top 10, snipers, bundlers, insiders, dev
    enabled: true            # free plan: 10,000 requests a month (one-time $1 activation), up to 200 tokens a request
    calls_per_day: 300       # stays inside the monthly allowance
    max_per_sec: 2
    batch_every_s: 900       # refresh every live token in batches of 200; the rest of the budget goes to call candidates
  solanatracker:             # SOLANATRACKER_API_KEY - Solana: snipers, bundlers, insiders, top 10, dev, LP burn
    enabled: true            # free plan: 10,000 requests a month
    calls_per_day: 300       # spent on call candidates only
    max_per_sec: 2
  gecko_info: {enabled: true}   # no key: holder count, mint / freeze authority, honeypot, GeckoTerminal score
  goplus:   {enabled: true, calls_per_min: 25}     # honeypot / tax / owner / mint / freeze checks, all chains incl. Solana
  metadata: {enabled: true, concurrency: 8, timeout_s: 6, image_hash: true, telegram_members: true}
  llm:                       # optional: Claude rates the meme / narrative (needs ANTHROPIC_API_KEY)
    enabled: true
    model: claude-opus-5-5   # best judgement; claude-haiku-5-5 is ~40x cheaper if cost matters more
    max_per_day: 150         # only near-call candidates are rated; this caps the spend

# ---------------------------------------------------------------- when a token is measured
# A "snapshot" is taken at each age below (seconds since launch): every factor is computed from
# what was knowable at that moment, stored, scored, and later labelled with what happened next.
# The same ages for every launchpad. Coins outside pump.fun are found 1-2 minutes after launch,
# so a snapshot may be taken up to `late_s` after its age (later than that, it is skipped).
checkpoints: [60, 180, 600, 1800]
checkpoint_late_s: {stream: 45, poll: 90}

activity_gate:               # tokens below this at a checkpoint are not worth a snapshot (same for all)
  min_buys: 12               # buys so far
  min_buyers: 10             # distinct buyers (where the launchpad lets us count them)
  max_idle_s: 90             # no trade / price change for longer = not active
  min_mcap_mult: 1.15        # price at least this multiple of the launch price (where the launch price is known)
  min_liquidity_usd: 4000    # pools only (a bonding curve always has liquidity)

pump:
  doa_age_s: 150             # dead on arrival: dropped from memory at this age with fewer than doa_buys buys
  doa_buys: 8
  sniper_slots: 5            # buys within this many slots (~0.4 s each) after the creation slot count as snipers
  early_trades: 400          # trades kept in full detail per token
  max_wallets: 4000
  bar_s: 15

# ---------------------------------------------------------------- what counts as "it ran"
label:
  target: 2.0                # x from the call price ...
  stop: 0.5                  # ... reached before falling to this multiple
  entry_slippage_pct: 3      # the call price is assumed to be this much worse than the last trade
  horizon_s: 21600           # 6 h
  idle_s: 900                # no trades for this long = the story is over, outcome is final
  min_mcap_usd: 1000         # pools priced below this, or with zero liquidity, give junk multiples: not recorded

# ---------------------------------------------------------------- when a call is sent
call:
  top_pct: 2.0               # before a learned model exists: call the top X% of prior scores (rolling 24 h)
  min_prior: 62              # ... but never below this score [CALL_MIN_SCORE]
  target_precision: 0.50     # with a learned model: threshold tuned so this share of calls should 2x
  min_prob: 0.50             # ... and never below this chance of 2x [CALL_MIN_CHANCE, in percent: 50]
  max_per_hour: 10
  enrich_margin: 8           # run the slow pre-call checks (RugCheck, LLM) when within this many points of calling
  mcap_usd: {min: 4500, max: 400000}
  allow_unknown_quote: false # pump coins paired against a token with no USD price are recorded, not called
  require_safety_check: true # no call unless the contract check (GoPlus) answered - pump.fun coins included
  conviction:                # extra label on a call, ranked against every snapshot of the last 24 h
    high_top_pct: 5          # 🔥 high: top 5% (2026-10-14..16: these 2x'd ~50%, 10x'd ~3%)
    very_high_top_pct: 1     # 🔥🔥 very high: top 1% (2x'd ~73%, 4x'd ~33%, 10x'd ~15%)
    min_snapshots: 500       # fewer in the last 24 h: no label
  pull_proof:                # only call coins whose liquidity cannot be pulled (PULL_PROOF_ONLY=true/false)
    only: true
    # always pull-proof: a coin still on a bonding curve (the launchpad's program holds the money)
    # after graduation, only these launchpads lock or burn the liquidity (pump.fun burns the LP on
    # PumpSwap, PONS keeps the Uniswap v4 position in its locker, four.meme burns the LP). Checked
    # 2026-10-16: 56/60, 17/18 and 18/18 sampled pools still held liquidity; raw Uniswap / Meteora
    # DAMM v2 pools were 87-100% empty.
    graduated_locked: [pump.fun, pons, four.meme]
    min_locked_pct: 95       # anything else: only with this much of the LP locked or burned (GMGN / GoPlus / Solana Tracker)

# Vetoes. Safety ones (cannot sell, tax, owner can mint / blacklist, thin liquidity, flagged as rugged,
# mcap range) always apply. The opinion ones below marked (*) apply while the scorecard decides and
# step aside once a learned model is in use - it has seen how such launches really end.
gates:                       # one list for every launchpad
  max_tax_pct: 10
  min_liquidity_usd: 6000    # pools only
  max_bundle_held_pct: 25    # (*) supply STILL held by wallets that bought in the creation slot or the sniper slots
  max_top10_pct: 55          # (*)
  max_dev_hold_pct: 25       # (*) dev / creator share of supply
  max_dev_sold_pct: 60       # (*) share of the dev's own bag already sold
  max_drawdown_pct: 55       # (*) below the high so far
  max_creator_launches_24h: 6   # (*)
  max_insider_pct: 30        # (*) GMGN: supply held by insider (rat trader) wallets
  max_phishing_pct: 30       # (*) GMGN: supply held by phishing (entrapment) wallets - tokens sent, not bought
  max_rug_ratio: 0.6         # (*) GMGN's rug score (0-1)
  serial_creator_min_launches: 50   # (*) a creator with at least this many coins ...
  serial_creator_max_grad_ratio: 0.05   # (*) ... of which fewer than this share graduated = a coin farm
  max_creator_pulls: 1       # a creator whose earlier coin lost its liquidity this many times is never called

# ---------------------------------------------------------------- paper trading (no money involved)
paper:
  enabled: true              # PAPER_TRADING=true/false
  stake_usd: 25              # PAPER_STAKE_USD
  min_tier: 2                # 2 = very high conviction only, 1 = high and very high (PAPER_MIN_TIER)
  take_profit:               # [multiple of the entry, share of the ORIGINAL position sold there]
    - [2, 0.50]              # the initial back
    - [4, 0.25]
    - [8, 0.25]
  stop: 0.5                  # before the first take-profit: sell everything at this multiple (-50%)
  stop_after_first: null     # after it: e.g. 1.0 = sell the rest if it falls back to the entry price
  slippage_pct: 3            # buy this much above the price when the call goes out; every sell this much below
  fee_pct: 1.0               # per buy and per sell (trading-bot / platform fee)
  telegram: true             # reply under the call with each paper sell

# ---------------------------------------------------------------- learning who pulls liquidity
pulls:
  enabled: true
  check_ages_h: [6, 24, 48]  # each DEX coin that got a snapshot is looked up again at these ages (GeckoTerminal)
  empty_usd: 50              # pool reserves below this = liquidity gone (pulled, or drained by the creator dumping)
  min_liq_usd: 1000          # ... but only for coins that once held at least this much
  batch: 30                  # tokens per GeckoTerminal request
  every_s: 600
  max_requests: 4            # per round: GeckoTerminal's free ~5/min is shared with launch discovery

# ---------------------------------------------------------------- self-learning
learn:
  retrain_hours: 12
  min_rows: 1500             # labelled snapshots needed before a model is trained
  min_pos: 60                # ... of which this many winners
  max_rows: 250000           # newest labelled snapshots used per retrain (~120 MB of RAM while training)
  promote_margin: 0.0        # challenger must beat champion PR-AUC by this much on the newest unseen data
  lift_bins: 5
  wallets:
    early_buyers: 40         # first N distinct buyers of a token are credited / blamed for its outcome
    min_tokens: 6            # a wallet needs this much history before it is called smart or toxic
    smart_lift: 1.8          # win rate vs. the average early buyer
    toxic_lift: 0.7          # creation-slot regulars whose picks win this little vs. average = bundlers

# ---------------------------------------------------------------- what is kept on disk
storage:
  max_gb: 20                 # hard cap (database + models); above 90% of it the oldest history is dropped
  retention_days:
    snapshots: 120           # training data (~1 KB each, ~9,000/day = ~1 GB at full retention)
    calls: 365               # every alert and its snapshot
    tokens: 30               # how each snapshotted token ended + thinned price path (~2 KB each)
    wallets: 45              # wallets seen fewer than 4 times are forgotten after this ...
    stale: 120               # ... and any wallet / creator not seen for this long
    seen: 10                 # name / symbol / image / social counters for uniqueness factors

# Each of these can also be set from the environment (Hostinger Docker Manager), named in brackets.
telegram:
  enabled: true              # [TELEGRAM_ENABLED]
  # bot token [TELEGRAM_BOT_TOKEN] and chat id(s) [TELEGRAM_CHAT_ID, comma-separated for several] come from .env
  thread_id: null            # [TELEGRAM_THREAD_ID] post into one topic of a forum group
  outcome_updates: true      # [TELEGRAM_OUTCOME_UPDATES] reply under each call when it hits 2x / stops out
  silent_outcomes: true      # [TELEGRAM_SILENT_OUTCOMES] outcome replies arrive without a notification sound
  daily_summary_utc: "06:00" # [TELEGRAM_DAILY_SUMMARY_UTC] "off" to disable
  commands: false            # [TELEGRAM_COMMANDS] answer /status /calls /stats /help in the chat. Needs a bot of
                             # its own: a bot that another app (e.g. Ignition & Coil) already polls cannot do both

dashboard:
  enabled: true
  bind_host: 127.0.0.1       # the VPS compose file sets 0.0.0.0 (login then enforced)
  port: 8010
  base_url: http://localhost:8010
  cookie_secure: false
  session_days: 30

# ---------------------------------------------------------------- studying the data on the PC
research:
  sync_url: https://srv1479428.hstgr.cloud/radar   # tools/sync_research.py copies the VPS's daily research files from here
